name: Release

on:
  push:
    tags:
      - 'v*'                        # triggers on v1.0.0, v2.0.0, v3.0.0 etc.

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # needed to get full git history

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release AAR
        run: ./gradlew :image-loader-compose:assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: image-loader-compose/build/outputs/aar/*.aar
          generate_release_notes: true
          body: |
            ## AsyncPic ${{ github.ref_name }}
            
            Install via JitPack:
