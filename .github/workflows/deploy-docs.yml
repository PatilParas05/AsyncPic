name: Deploy Docs

on:
  push:
    branches: [ main ]
    paths: [ 'AsyncPic-Docs/**' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AsyncPic-Docs/package-lock.json

      - name: Install dependencies
        working-directory: AsyncPic-Docs
        run: npm ci

      - name: Build docs
        working-directory: AsyncPic-Docs
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: AsyncPic-Docs/build
          publish_branch: gh-pages